name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"   # todos os dias às 03:00 UTC
  workflow_dispatch:       # permite correr à mão no separador Actions
  push:
    branches: [main]

permissions:
  contents: write          # a Action precisa de escrever no branch "output"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg?color_snake=#7B61FF&color_dots=#ebedf0,#c6c6c6,#8c8c8c,#555555,#1f1f1f
            dist/snake-dark.svg?color_snake=#7B61FF&color_dots=#161b22,#333333,#666666,#a3a3a3,#e6e6e6

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
